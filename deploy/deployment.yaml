apiVersion: apps/v1
kind: Deployment
metadata:
  name: configiq
  namespace: psap-configiq
  labels:
    app: configiq
    app.kubernetes.io/name: configiq
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: configiq
  template:
    metadata:
      labels:
        app: configiq
        app.kubernetes.io/name: configiq
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: quay.io/rh-ee-mazam/gpu-calc-v2:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: AICONFIGURATOR_API_URL
              value: "http://aiconfigurator-sla-service:7860"
            - name: AICONFIGURATOR_TIMEOUT_SECONDS
              value: "90"

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always
